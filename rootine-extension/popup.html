<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rootine Focus Plant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">ROOTINE FOCUS</p>
      <section id="plant-card" class="plant-card" aria-live="polite">
        <div id="plant" class="plant" aria-hidden="true">🌱</div>
        <h1 id="status-heading">Checking your focus…</h1>
        <p id="status-message">Looking at the active domain.</p>
        <p id="checked-domain" class="domain" hidden></p>
        <div class="risk-summary">
          <div class="risk-copy">
            <span>Plant death risk</span>
            <strong id="risk-percent">0%</strong>
          </div>
          <div
            id="risk-track"
            class="risk-track"
            role="progressbar"
            aria-label="Plant death risk"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="risk-bar"></span>
          </div>
          <p id="risk-note" class="risk-note">No distraction risk recorded.</p>
        </div>
        <button id="replant-button" class="replant-button" type="button" hidden>
          Start a new seed
        </button>
      </section>

      <section class="settings" aria-labelledby="whitelist-heading">
        <h2 id="whitelist-heading">Whitelisted domains</h2>
        <p class="help">
          A listed domain also allows its subdomains. No paths, searches, or
          page content are saved.
        </p>
        <form id="domain-form">
          <label for="domain-input">Add a domain</label>
          <div class="add-row">
            <input
              id="domain-input"
              type="text"
              inputmode="url"
              autocomplete="off"
              placeholder="example.com"
              required
            />
            <button type="submit">Add</button>
          </div>
          <p id="form-error" class="error" role="alert"></p>
        </form>
        <ul id="domain-list" class="domain-list"></ul>
      </section>
    </main>
    <script src="domain.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
